{% extends "base.html" %}

{% block title %}contact{% endblock title %}

{% block body  %}

<div class="container">
    <div id="carouselExampleSlidesOnly" class="carousel slide" data-bs-ride="carousel">
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="/static/img/aaa.jpg" class="d-block w-100" alt="...">
    </div>
  </div>
</div>
<h1 class="text-center">Contact Us</h1>
<form method="post" action="/contact">
{% csrf_token %}
    <div class="mb-3">
    <label for="name" class="form-label">Name</label>
    <input type="name" class="form-control" id="name" name="name" placeholder='Enter Your name'>
    
  </div>
  <div class="mb-3">
    <label for="Email" class="form-label">Email </label>
    <input type="Email" class="form-control" id="Email" name="Email" aria-describedby="Email">
    <div id="Email" class="form-text">We'll never share your email with anyone else.</div>
  </div>
  <div class="mb-3">
    <label for="phone" class="form-label">phone number</label>
    <input type="number" class="form-control" id="phone" name="phone">
  </div>
  <div class="mb-3 form-group">
    <label for="dcse">Message us</label>
    <textarea name="dcse" id="dcse" class="form-control"></textarea>

  </div>
  <button type="submit" class="btn btn-primary">Submit</button>
</form>
</div>
{% endblock body  %}
